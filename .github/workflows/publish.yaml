name: Publish VS Code extension

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .tool-versions
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Package extension
        run: npm run package
      - name: Azure login using GitHub OIDC
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Verify Marketplace access
        run: |
          publisher_id="$(node --print "require('./package.json').publisher")"
          test -n "$publisher_id"
          npx vsce verify-pat "$publisher_id" --azure-credential
      - name: Publish extension
        run: npx vsce publish --packagePath ./*.vsix --azure-credential
